    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#58c6ff"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#background)"/>

    <g fill="none" stroke="#6bbcff" stroke-width="1.5" opacity="0.13">
